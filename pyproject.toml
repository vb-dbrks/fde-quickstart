[project]
name = "app"
version = "0.1.0"
description = "Databricks App quick-start: FastAPI + React on Lakebase Postgres, with a stateless agent runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ag-ui-protocol==0.1.19",
    "alembic>=1.16",
    "databricks-langchain>=0.20",
    "databricks-sdk>=0.81",
    "fastapi>=0.140",
    "httpx>=0.28",
    "langchain-core>=1.0",
    "mlflow>=3.10",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.50",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pgserver>=0.1.4",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
    "types-pyyaml>=6.0",
    { include-group = "eval" },
]
eval = [
    "mlflow[databricks]>=3.10",
]

[tool.uv]
# The app is not installed as a package: Databricks Apps runs it from the source root (python -m backend).
package = false
# Databricks Apps installs the default groups at deploy time; keep that to runtime dependencies only.
# Local tooling uses `uv sync --all-groups` (see Makefile).
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["backend/static", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT", "S", "T20"]
ignore = [
    "E501", # the formatter enforces line length for code; long comments and docstrings are fine
    "S101", # assert is fine in tests and type narrowing
    "N818", # exception names read as events (AgentRunFailed); no Error suffix required
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["T20", "S603", "S607"]
"evals/**" = ["T20"]
"alembic/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "evals"]
# alembic/ at the repo root holds migrations; `import alembic` is the library.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "alembic", "tests", "evals", "scripts"]
exclude = ["backend/static/"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# pgserver re-exports its API without __all__.
module = ["pgserver", "pgserver.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# Untyped third-party modules.
module = ["databricks_langchain", "databricks_langchain.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# MLflow's scorer constructors are not annotated.
module = ["evals.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error::DeprecationWarning:backend.*",
    "ignore::DeprecationWarning:mlflow.*",  # MLflow internals on SQLAlchemy 2.1
    "ignore::DeprecationWarning:unitycatalog.*",  # pulled in by databricks-langchain
]
