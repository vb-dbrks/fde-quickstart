# Databricks Apps runtime configuration. Dependencies install from pyproject.toml + uv.lock (there is
# deliberately no requirements.txt). `valueFrom` refers to resources declared in resources/app.app.yml;
# Lakebase connection details (PGHOST, PGDATABASE, PGUSER, ...) are injected automatically.
command: ["uv", "run", "--frozen", "python", "-m", "backend"]

env:
  - name: APP_TITLE
    value: "{{project_title}}"
  - name: APP_ADMIN_EMAILS
    value: "{{admin_emails}}"
  # The agent runtime runs inside this app, behind the same HTTP contract a separate agent app would
  # serve (docs: "Splitting the agent into its own app"). For a split deployment set `http` and
  # AGENT_API_BASE to the agent app's URL.
  - name: AGENT_TRANSPORT
    value: inprocess
  # Runners default to `real` because LLM_ENDPOINT is set. Uncomment to deploy with the fake agent,
  # e.g. before the model endpoint is available; AGENT_RUNNER_OVERRIDES=generate=real mixes them.
  # - name: AGENT_RUNNER
  #   value: fake
  - name: LLM_ENDPOINT
    valueFrom: llm-endpoint
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: experiment
